    d="M2.6 45.4V19.6a18.4 18.4 0 0 1 36.8 0v25.8a1.6 1.6 0 0 1-1.6 1.6H4.2a1.6 1.6 0 0 1-1.6-1.6Z"
    fill="#A14834"
    stroke="#26190E"
    stroke-width="2.6"
    stroke-linejoin="round"
  />
  <path
    d="M9.4 44V20.2a11.6 11.6 0 0 1 23.2 0V44"
    stroke="#CF9E46"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.85"
  />

  <!-- Lotus: three petals, kept bold so it still reads at 30px in the bar. -->
  <path
    d="M21 15.4c2.9 3.4 2.9 8.6 0 12-2.9-3.4-2.9-8.6 0-12Z"
    fill="#F6EDD9"
  />
  <path
    d="M21 27.4c-4.3-1.2-7.2-4.6-6.9-8.6 3.4.9 6.1 4.3 6.9 8.6Z"
    fill="#F6EDD9"
