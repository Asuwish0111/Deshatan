  />
  <path
    d="M21 27.4c4.3-1.2 7.2-4.6 6.9-8.6-3.4.9-6.1 4.3-6.9 8.6Z"
    fill="#F6EDD9"
    opacity="0.86"
  />
  <circle cx="21" cy="33.4" r="1.9" fill="#CF9E46" />

  <!-- the plinth the arch stands on -->
  <rect x="12.4" y="38.6" width="17.2" height="2.4" rx="1.2" fill="#F6EDD9" opacity="0.5" />
</svg>
